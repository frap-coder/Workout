name: Build Android app
on:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'dist/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:
    inputs:
      version_code:
        description: Higher than every previously uploaded Play version
        required: true
        default: '1'
      version_name:
        description: User-visible version
        required: true
        default: '1.0.0'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android API 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install and sync app
        run: npm ci && npm run android:sync
      - name: Build test APK and check Android code
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: Daily-Reps-Android-test
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/lint-results-debug.html
      - name: Build signed Play bundle
        if: github.event_name == 'workflow_dispatch'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          WORKOUT_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WORKOUT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WORKOUT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WORKOUT_VERSION_CODE: ${{ inputs.version_code }}
          WORKOUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          python - <<'PY'
          import base64, os, pathlib, subprocess
          for key in ['ANDROID_KEYSTORE_BASE64','WORKOUT_STORE_PASSWORD','WORKOUT_KEY_ALIAS','WORKOUT_KEY_PASSWORD']:
              if not os.environ.get(key):
                  raise SystemExit('Missing signing secret: '+key)
          keyfile=pathlib.Path(os.environ['RUNNER_TEMP'])/'workout-upload.jks'
          keyfile.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'],validate=True))
          keyfile.chmod(0o600)
          env=os.environ.copy();env['WORKOUT_KEYSTORE_FILE']=str(keyfile)
          try:
              subprocess.run(['./gradlew','--no-daemon','bundleRelease'],cwd='android',env=env,check=True)
          finally:
              keyfile.unlink(missing_ok=True)
          PY
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: Daily-Reps-Play-bundle
          path: android/app/build/outputs/bundle/release/*.aab
