name: Publish workout app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run release checks
        run: |
          node tests/release.cjs
          node tests/offline-runtime.cjs
          node tests/library.cjs
          node tests/experience.cjs
          node tests/overtime.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/workout-browser" --no-package-lock --no-save playwright@1.58.2
          "$RUNNER_TEMP/workout-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check mobile and desktop flows
        timeout-minutes: 3
        run: NODE_PATH="$RUNNER_TEMP/workout-browser/node_modules" node tests/browser.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

