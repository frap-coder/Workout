name: Publish workout app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prepare static language packs
        run: |
          npm install --prefix "$RUNNER_TEMP/workout-locales" --no-package-lock --no-save acorn@8.15.0
          NODE_PATH="$RUNNER_TEMP/workout-locales/node_modules" node scripts/extract-messages.cjs
          python scripts/build-locales.py
      - name: Keep generated translations in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/locales.js scripts/messages.en.json scripts/fitness-terms.en.json
          if ! git diff --cached --quiet; then
            git commit -m "Update static language packs [skip ci]"
            git push origin HEAD:main
          fi
      - name: Run release checks
        run: |
          node tests/release.cjs
          node tests/offline-runtime.cjs
          node tests/library.cjs
          node tests/experience.cjs
          node tests/overtime.cjs
          node tests/instructions.cjs
          node tests/order.cjs
          node tests/kettlebells.cjs
          node tests/public-app.cjs
          node tests/ui-polish.cjs
          node tests/languages.cjs
      - name: Install browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/workout-browser" --no-package-lock --no-save playwright@1.58.2
          "$RUNNER_TEMP/workout-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check mobile and desktop flows
        timeout-minutes: 3
        run: NODE_PATH="$RUNNER_TEMP/workout-browser/node_modules" node tests/browser.cjs
      - name: Check six-language setup and training flows
        run: NODE_PATH="$RUNNER_TEMP/workout-browser/node_modules" node tests/languages-browser.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

